<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataCheck — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 30%, #0d1137 60%, #030512 100%);
            overflow: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgFloat {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            33% {
                transform: translate(2%, -2%) rotate(1deg);
            }

            66% {
                transform: translate(-1%, 1%) rotate(-1deg);
            }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(15, 20, 50, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: cardAppear 0.6s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {

            0%,
            100% {
                box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
            }

            50% {
                box-shadow: 0 8px 48px rgba(99, 102, 241, 0.6);
            }
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: #f0f0ff;
            letter-spacing: -0.5px;
        }

        .logo p {
            font-size: 13px;
            color: rgba(160, 170, 220, 0.7);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(180, 190, 230, 0.8);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(30, 35, 70, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            color: #e0e0ff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: rgba(99, 102, 241, 0.6);
            background: rgba(30, 35, 70, 0.8);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(120, 130, 170, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            color: #fca5a5;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            animation: shakeError 0.4s ease-out;
        }

        @keyframes shakeError {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: rgba(120, 130, 170, 0.4);
            line-height: 1.6;
        }

        /* Loading Overlay (Themed) */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 20, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .db-icon {
            font-size: 48px;
            margin-bottom: 30px;
            animation: dbFloat 2s ease-in-out infinite;
        }

        @keyframes dbFloat {

            0%,
            100% {
                transform: translateY(0);
                filter: drop-shadow(0 5px 15px rgba(99, 102, 241, 0.4));
            }

            50% {
                transform: translateY(-10px);
                filter: drop-shadow(0 15px 25px rgba(99, 102, 241, 0.6));
            }
        }

        .progress-container {
            width: 240px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #06b6d4);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
            transition: width 0.3s ease;
        }

        .loading-status {
            color: #a0aec0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <!-- Premium Loading Overlay (Themed) -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="db-icon">🛢️</div>
        <div class="progress-container">
            <div id="loginProgressBar" class="progress-fill"></div>
        </div>
        <div class="loading-status" id="loginStatus">Autenticando...</div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon">🛡️</div>
                <h1>DataCheck</h1>
                <p>Panel de Monitoreo SQL Server</p>
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" placeholder="Ingresa tu usuario" required autocomplete="username">
                </div>
                <div class="form-group" id="passwordGroup">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required
                        autocomplete="current-password">
                </div>
                <div class="form-group" id="mfaGroup" style="display: none;">
                    <label for="mfaToken">Código de Autenticación (MFA)</label>
                    <input type="text" id="mfaToken" placeholder="000000" maxlength="6" inputmode="numeric">
                    <p style="font-size: 11px; color: rgba(160, 170, 220, 0.6); margin-top: 8px;">Ingresa el código de 6
                        dígitos de tu app de Microsoft Authenticator.</p>
                </div>

                <!-- Google reCAPTCHA Widget -->
                {% if site_key and RECAPTCHA_ENABLED != 'false' %}
                <div class="form-group" style="display: flex; justify-content: center; margin-top: 10px;">
                    <div class="g-recaptcha" data-sitekey="{{ site_key }}" data-theme="dark">
                    </div>
                </div>
                {% endif %}

                <button type="submit" class="login-btn" id="loginBtn">Iniciar Sesión</button>
            </form>

            <p class="footer-text">DataCheck Web © 2026<br>{{ APP_VERSION }}</p>
        </div>
    </div>

    {% if site_key %}
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    {% endif %}

    <script>
        window.API_BASE = "{{ APP_BASE_URL }}";
        async function handleLogin(e) {
            e.preventDefault();

            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.classList.add('loading');
            btn.textContent = 'Verificando...';
            errorMsg.style.display = 'none';

            // Show loading overlay
            const topOverlay = document.getElementById('loadingOverlay');
            const progBar = document.getElementById('loginProgressBar');
            const statusText = document.getElementById('loginStatus');

            if (topOverlay) topOverlay.classList.remove('hidden');
            if (progBar) {
                progBar.style.width = '35%';
                statusText.textContent = 'Verificando Credenciales...';
            }

            try {
                const token = document.getElementById('mfaToken').value.trim();
                // Get recaptcha token if widget exists
                let recaptcha_token = '';
                if (typeof grecaptcha !== 'undefined') {
                    recaptcha_token = grecaptcha.getResponse();
                }

                const res = await fetch(window.API_BASE + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, token, recaptcha_token })
                });

                if (progBar) {
                    progBar.style.width = '70%';
                    statusText.textContent = 'Iniciando Sesión SQL...';
                }

                const data = await res.json();

                if (data.success) {
                    if (progBar) {
                        progBar.style.width = '100%';
                        statusText.textContent = 'Acceso Concedido ✅';
                    }
                    setTimeout(() => window.location.href = '{{ APP_BASE_URL }}/', 500);
                } else if (data.requires_mfa) {
                    if (topOverlay) topOverlay.classList.add('hidden');
                    // Show MFA field
                    document.getElementById('passwordGroup').style.display = 'none';
                    document.getElementById('username').readOnly = true;
                    document.getElementById('mfaGroup').style.display = 'block';
                    document.getElementById('mfaToken').required = true;
                    document.getElementById('mfaToken').focus();

                    btn.classList.remove('loading');
                    btn.textContent = 'Verificar Código';
                    errorMsg.style.display = 'none';
                } else {
                    if (topOverlay) topOverlay.classList.add('hidden');
                    errorMsg.textContent = data.message || 'Credenciales incorrectas';
                    errorMsg.style.display = 'block';
                    btn.classList.remove('loading');
                    btn.textContent = 'Iniciar Sesión';

                    // Reset reCAPTCHA on failure if widget exists
                    if (typeof grecaptcha !== 'undefined') {
                        grecaptcha.reset();
                    }
                }
            } catch (err) {
                const topOverlay = document.getElementById('loadingOverlay');
                if (topOverlay) topOverlay.classList.add('hidden');
                errorMsg.textContent = 'Error de conexión con el servidor';
                errorMsg.style.display = 'block';
                btn.classList.remove('loading');
                btn.textContent = 'Iniciar Sesión';
            }
        }
    </script>
</body>

</html>
